[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deid-kit"
version = "0.1.0"
description = "Korean-first local de-identification toolkit: text, Excel, CSV, PDF, DOCX, HWPX, images, screenshots, clipboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "openpyxl>=3.1",
  "pillow>=10",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "cryptography>=42",
  "pytesseract>=0.3.10",
  "ocrmac>=1.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
ner = ["transformers>=4.40", "torch>=2.2"]
gliner = ["gliner>=0.2"]
dev = ["pytest>=8", "presidio-analyzer>=2.2"]

[project.scripts]
deid = "deid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deid = ["data/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
